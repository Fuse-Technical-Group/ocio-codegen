# Dependabot version-update PRs. Complements (does not replace) Dependabot
# security updates, which open PRs for vulnerability alerts independently.
version: 2
updates:
  # Actions are pinned to release tags; Dependabot rewrites the tag. The
  # notation reusable workflow tracks a notation--v* tag, which Dependabot
  # does not follow, so bump that by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release has a week to draw a follow-up fix before it is proposed.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    # `build(deps):` keeps the PR out of flywheel's auto_merge types
    # (.flywheel.yml), so a bump waits for a human review.
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Move uv.lock, and touch pyproject.toml only when a release crosses a
    # bound such as opencolorio's major cap.
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    # ruff and pyright bring new findings that need code edits, so they do
    # not hold up the library bumps.
    groups:
      python-lint:
        patterns: ["ruff", "pyright"]
      python-packages:
        patterns: ["*"]
        exclude-patterns: ["ruff", "pyright"]
    commit-message:
      prefix: "build"
      include: "scope"
