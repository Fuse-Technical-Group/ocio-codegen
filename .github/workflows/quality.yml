name: quality
on:
  pull_request:
  merge_group:

# The python job runs repository code (pytest) on pull_request, so give the
# token nothing beyond the checkout it needs.
permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Lint root governance/landing docs (README, SPEC, ROADMAP).
      # Config: .markdownlint.json + .markdownlint-cli2.jsonc.
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "*.md"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact release: setup-uv stopped publishing floating
      # major tags at v8, so `@v9` does not exist and `@v7` would be mutable.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # Pinned to 3.12: opencolorio publishes no wheel for 3.13+.
      - run: bash tools/ci.sh

  # The ruleset requires a `shellcheck` check. The file list comes from git
  # rather than a glob, so an untracked scratch script cannot fail the build
  # and a script added anywhere is covered without editing this workflow.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No tracked shell scripts."
            exit 0
          fi
          printf 'checking %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  #
  # SPEC status lines, slug-suffix heading grammar, and §-reference
  # resolution are validated by the symphonize notation contract in
  # governance-lint.yml.
